<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captchosa</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <div class="wrap">
    <header class="top">
      <img class="mark" src="../icons/icon128.png" alt="">
      <h1>Captchosa <small id="versionName"></small></h1>
      <label class="switch lg" data-i18n-title="masterSwitch">
        <input type="checkbox" id="enabled" role="switch" data-i18n-aria="masterSwitch">
        <span class="track"></span>
      </label>
    </header>

    <div class="status-row">
      <div class="pill" id="statusPill" role="status" aria-live="polite">
        <span class="dot"></span><span class="conn" id="connText" data-i18n="checking">Checking…</span>
        <span class="bal" id="balanceBox"><span data-i18n="balance">Balance</span> <b id="balance">—</b></span>
      </div>
    </div>

    <main>
      <div class="col">
        <section class="card" aria-labelledby="connTitle">
          <h2 id="connTitle" data-i18n="connection">Connection</h2>
          <div class="field">
            <label for="serviceUrl" data-i18n="serviceUrl">Service URL</label>
            <input class="text-input" type="url" id="serviceUrl" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8790">
            <small data-i18n="serviceUrlHint"></small>
          </div>
          <div class="field">
            <label for="clientKey" data-i18n="clientKey">Client key</label>
            <span class="key">
              <input class="text-input" type="password" id="clientKey" spellcheck="false" autocomplete="off">
              <button type="button" class="btn" id="toggleKey" data-i18n="show">Show</button>
            </span>
          </div>
          <div class="actions">
            <button type="button" class="btn primary" id="save" data-i18n="save">Save</button>
            <button type="button" class="btn" id="test" data-i18n="test">Test connection</button>
          </div>
          <div class="message" id="message" role="status" aria-live="polite"></div>
        </section>

        <section class="card behaviour" aria-labelledby="behaviourTitle">
          <h2 id="behaviourTitle" data-i18n="behaviour">Behaviour</h2>
          <div class="row">
            <span class="label"><span data-i18n="autoSolve">Auto-solve</span><small data-i18n="autoSolveHint"></small></span>
            <label class="switch"><input type="checkbox" id="autoSolve" role="switch" data-i18n-aria="autoSolve"><span class="track"></span></label>
          </div>
          <div class="row stack">
            <div class="range-head"><label for="delayMs" data-i18n="delay">Delay before solving</label><output id="delayOut" for="delayMs"></output></div>
            <input type="range" id="delayMs" min="0" max="5000" step="100">
          </div>
          <div class="row">
            <span class="label"><span id="retriesLabel" data-i18n="retries">Retries</span><small data-i18n="retriesHint"></small></span>
            <span class="stepper" role="group" aria-labelledby="retriesLabel">
              <button type="button" id="retriesDown" aria-label="−">−</button>
              <input type="number" id="retries" min="1" max="10" aria-labelledby="retriesLabel">
              <button type="button" id="retriesUp" aria-label="+">+</button>
            </span>
          </div>
          <div class="row">
            <span class="label"><span data-i18n="submitAfterFill">Submit after filling text</span><small data-i18n="submitAfterFillHint"></small></span>
            <label class="switch"><input type="checkbox" id="submitAfterFill" role="switch" data-i18n-aria="submitAfterFill"><span class="track"></span></label>
          </div>
          <div class="row">
            <span class="label"><span data-i18n="blsGridSubmit">Press Verify after BLS grid</span><small data-i18n="blsGridSubmitHint"></small></span>
            <label class="switch"><input type="checkbox" id="blsGridSubmit" role="switch" data-i18n-aria="blsGridSubmit"><span class="track"></span></label>
          </div>
          <div class="row">
            <span class="label"><span data-i18n="pageBadge">Status badge on the page</span><small data-i18n="pageBadgeHint"></small></span>
            <label class="switch"><input type="checkbox" id="pageBadge" role="switch" data-i18n-aria="pageBadge"><span class="track"></span></label>
          </div>
          <div class="row">
            <label for="lang" data-i18n="language">Language</label>
            <select id="lang">
              <option value="auto" data-i18n="languageAuto">Browser language</option>
              <option value="en">English</option><option value="tr">Türkçe</option>
              <option value="az">Azərbaycanca</option><option value="ru">Русский</option>
            </select>
          </div>
        </section>
      </div>

      <div class="col">
        <section class="card" aria-labelledby="solversTitle">
          <h2 id="solversTitle" data-i18n="solvers">Solvers</h2>
          <div id="solvers"></div>
        </section>

        <details class="card" id="activity" open>
          <summary><span data-i18n="activity">Recent activity</span><span class="count" id="logCount">0</span>
            <button type="button" class="btn small ghost" id="clearLog" data-i18n="clearLog">Clear</button></summary>
          <ol id="log"></ol>
        </details>

        <section class="card about" aria-labelledby="advTitle">
          <h2 id="advTitle" data-i18n="advanced">Advanced</h2>
          <p data-i18n="aboutText"></p>
          <p data-i18n="allowAllSitesHint"></p>
          <div class="actions"><button type="button" class="btn" id="allowAll" data-i18n="allowAllSites">Allow on all sites</button>
            <button type="button" class="btn" id="resetStats" data-i18n="resetStats">Reset counters</button></div>
        </section>
      </div>
    </main>
  </div>

  <script src="../common/defaults.js"></script>
  <script src="ui.js"></script>
</body>
</html>
